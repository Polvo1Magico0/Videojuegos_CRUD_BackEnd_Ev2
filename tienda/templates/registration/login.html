<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balagames - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-gamer {
            background-color: #1e1e1e;
            border: 1px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .form-label-custom {
            color: #00ffcc;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        /* Estilo para los inputs autogenerados por Django */
        form p label {
            color: #00ffcc;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        
        form p input {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #ff0055;
            padding: 10px;
            width: 100%;
            border-radius: 7px;
        }

        form p input:focus {
            outline: none;
            border-color: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }

        .btn-neon-danger {
            background-color: transparent;
            color: #ff0055;
            border: 2px solid #ff0055;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-neon-danger:hover {
            background-color: #ff0055;
            color: white;
            box-shadow: 0 0 20px #ff0055;
        }
        
        .error-msg {
            color: #ff4444;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card-gamer">
        <h2 class="titulo">
            <span style="color: #ff4444; text-shadow: 0 0 10px #ff4444;">ACCESO</span>
            <span style="color: #4444ff; text-shadow: 0 0 10px #4444ff;">SISTEMA</span>
            <span style="color: #ff0055; font-size: 0.8em;">𒉭</span>
        </h2>

        {% if form.errors %}
            <div class="error-msg">
                Credenciales incorrectas. El Stand enemigo bloqueó tu acceso.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="btn btn-neon-danger w-100 fw-bold py-2">
                ENTRAR AL INVENTARIO
            </button>
        </form>
    </div>

</body>
</html>
