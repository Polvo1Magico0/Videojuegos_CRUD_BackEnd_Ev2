<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balagames - Sesion Cerrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-gamer {
            background-color: #1e1e1e;
            border: 1px solid #ff0055;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }
        .titulo {
            margin-bottom: 20px;
            font-weight: bold;
        }
        .btn-neon {
            background-color: transparent;
            color: #00ffcc;
            border: 2px solid #00ffcc;
            transition: 0.3s;
            margin-top: 20px;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 7px;
            font-weight: bold;
        }
        .btn-neon:hover {
            background-color: #00ffcc;
            color: black;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>
</head>
<body>
    <div class="card-gamer">
        <h3 class="titulo">
            <span style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">SESION</span>
            <span style="color: #00ffcc; text-shadow: 0 0 10px #00ffcc;">CERRADA</span>
        </h3>
        <p class="text-muted mb-4">Has salido del sistema de Balagames correctamente.</p>
        <a href="{% url 'login' %}" class="btn-neon">INICIAR SESION NUEVAMENTE</a>
    </div>
</body>
</html>
