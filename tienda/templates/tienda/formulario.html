<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Añadir Juego</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; }
        .card-gamer { background-color: #1e1e1e; border: 1px solid #ff0055; box-shadow: 0 0 15px #ff0055; }
        .btn-neon-danger { background-color: transparent; color: #ff0055; border: 2px solid #ff0055; transition: 0.3s; }
        .btn-neon-danger:hover { background-color: #ff0055; color: white; box-shadow: 0 0 20px #ff0055; }
        
        form p label { color: #00ffcc !important; font-weight: bold; margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 1px;}
        form p input, form p select { background-color: #2b2b2b !important; color: #ffffff !important; border: 1px solid #ff0055 !important; padding: 10px; width: 100%; border-radius: 5px; }
        form p input:focus, form p select:focus { outline: none; box-shadow: 0 0 8px #ff0055; border-color: #ff0055; }
        
        form p input[type="file"] {
            padding: 30px 20px;
            border: 2px dashed #ff0055 !important;
            color: #ff0055 !important;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        form p input[type="file"]:hover {
            background-color: #3a3a3a !important;
        }
    </style>
</head>
<body class="container mt-5 d-flex justify-content-center">
    <div class="card card-gamer p-5 w-100" style="max-width: 500px;">
        <h2 class="mb-2 text-center fw-bold">
            <span style="color: #ff4444; text-shadow: 0 0 10px #ff4444;">Insertar</span> <span style="color: #4444ff; text-shadow: 0 0 10px #4444ff;">Juego</span>
            <span style="font-size: 0.8em; color: #ff0055; text-shadow: none;">𒉭</span>
        </h2>
        <p class="text-center text-muted mb-4 fst-italic">El Stand de este juego es muy poderoso...</p>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="text-start">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-neon-danger w-100 fw-bold py-2 mt-3">ORA ORA ORA! (Guardar)</button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="{% url 'listar_juegos' %}" class="text-decoration-none" style="color: #bbb;">&larr; Volver a la base</a>
        </div>
    </div>
</body>
</html>
